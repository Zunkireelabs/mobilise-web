  (function () {
    const header = document.querySelector('[data-site-header]');
    const nav = header && header.querySelector('[data-nav]');
    if (!header || !nav) return;

    const fine = window.matchMedia('(hover: hover) and (pointer: fine)');
    const triggerOf = (item) => item.querySelector('[data-nav-trigger]');

    const stage = header.querySelector('[data-mega-stage]');
    const items = Array.from(nav.querySelectorAll('[data-nav-item]'));
    const indexOf = (item) => items.indexOf(item);

    const SHIFT = 24;

    let open = null;
    let leaving = null;
    let leavingTimer = 0;

    const FADE_MS = 200;
    const EASE = 'cubic-bezier(0.44, 0, 0.56, 1)';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

    // One height for every panel, so the stage and its lead lane never resize on a switch.
    const heightOf = () =>
      Math.max(0, ...items.map((item) => item.querySelector('[data-nav-panel]')?.offsetHeight ?? 0));

    const slide = (item, from, to) => {
      const panel = item.querySelector('[data-nav-panel]');
      if (!panel || typeof panel.animate !== 'function') return;

      if (panel.__slide) panel.__slide.cancel();
      if (reduced.matches) return;

      panel.__slide = panel.animate(
        [
          { transform: 'translate3d(' + from + 'px, 0, 0)' },
          { transform: 'translate3d(' + to + 'px, 0, 0)' },
        ],
        {
          duration: FADE_MS,
          easing: EASE,
          fill: to === 0 ? 'none' : 'forwards',
        },
      );
    };

    const clearLeaving = () => {
      if (leavingTimer) {
        clearTimeout(leavingTimer);
        leavingTimer = 0;
      }
      if (!leaving) return;
      const panel = leaving.querySelector('[data-nav-panel]');
      if (panel) panel.removeAttribute('inert');
      leaving.removeAttribute('data-mega-leaving');
      leaving.style.removeProperty('--mega-shift');
      leaving = null;
    };

    const close = () => {
      if (!open) return;
      const trigger = triggerOf(open);
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
      open.dataset.open = 'false';
      open.style.removeProperty('--mega-shift');
      open = null;
      clearLeaving();
      header.style.removeProperty('--mega-h');
    };

    const show = (item) => {
      if (open === item) return;

      const previous = open;
      const forward = previous ? indexOf(item) > indexOf(previous) : true;

      clearLeaving();

      if (previous) {
        const trigger = triggerOf(previous);
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
        previous.dataset.open = 'false';
        previous.setAttribute('data-mega-leaving', '');
        previous.style.setProperty('--mega-shift', (forward ? -SHIFT : SHIFT) + 'px');
        leaving = previous;

        const leavingPanel = previous.querySelector('[data-nav-panel]');
        if (leavingPanel) leavingPanel.setAttribute('inert', '');

        leavingTimer = window.setTimeout(clearLeaving, FADE_MS);
      }

      const target = heightOf(item);

      const trigger = triggerOf(item);
      if (trigger) trigger.setAttribute('aria-expanded', 'true');
      item.dataset.open = 'true';
      open = item;

      header.style.setProperty('--mega-h', target + 'px');

      if (previous) {
        // WAAPI, not a CSS transition: Chrome creates no transform transition for a
        // panel that was visibility:hidden in the before-state, so the incoming one
        // never animated. Slides run only on a switch — a first open has no direction.
        slide(item, forward ? SHIFT : -SHIFT, 0);
        slide(previous, 0, forward ? -SHIFT : SHIFT);
      }
    };

    nav.dataset.enhanced = '';

    for (const item of nav.querySelectorAll('[data-nav-item]')) {
      const trigger = triggerOf(item);

      if (!trigger) {
        item.addEventListener('pointerenter', (event) => {
          if (event.pointerType === 'mouse' && fine.matches) close();
        });
        continue;
      }

      /* A trigger that is also a link opens its panel on the first click and navigates on
         the next — with a mouse the hover has already opened it, so one click goes through. */
      trigger.addEventListener('click', (event) => {
        if (trigger.hasAttribute('href')) {
          if (item === open) return;
          event.preventDefault();
          show(item);
          return;
        }
        item === open ? close() : show(item);
      });

      item.addEventListener('pointerenter', (event) => {
        if (event.pointerType === 'mouse' && fine.matches) show(item);
      });

      item.addEventListener('focusout', (event) => {
        if (item === open && !item.contains(event.relatedTarget)) close();
      });
    }

    nav.addEventListener('pointerleave', (event) => {
      if (event.pointerType !== 'mouse' || !fine.matches) return;
      if (open && open.contains(document.activeElement)) return;
      close();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || !open) return;
      const trigger = triggerOf(open);
      close();
      if (trigger) trigger.focus();
    });

    document.addEventListener('pointerdown', (event) => {
      if (open && !open.contains(event.target)) close();
    });

    const desktop = window.matchMedia('(min-width: 1200px)');
    desktop.addEventListener('change', () => {
      if (!desktop.matches) close();
    });
  })();
