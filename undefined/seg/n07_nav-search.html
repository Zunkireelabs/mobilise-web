  (function () {
    var root = document.querySelector('[data-site-search]');
    if (!root) return;

    var trigger = root.querySelector('[data-search-open]');
    var dialog = root.querySelector('[data-search-dialog]');
    var form = root.querySelector('[data-search-form]');
    var input = root.querySelector('[data-search-input]');
    var closeButton = root.querySelector('[data-search-close]');
    var list = root.querySelector('[data-search-list]');
    var template = root.querySelector('[data-search-result-template]');
    var modifier = root.querySelector('[data-search-modifier]');

    if (!dialog || typeof dialog.showModal !== 'function') return;

    var isApple = /mac|iphone|ipad|ipod/i.test(
      (navigator.userAgentData && navigator.userAgentData.platform) ||
        navigator.platform ||
        navigator.userAgent,
    );
    if (isApple && modifier) modifier.textContent = '⌘';

    root.setAttribute('data-search-ready', '');

    function provider() {
      var api = window.thradSearch;
      return api && typeof api.query === 'function' ? api : null;
    }

    var STATES = ['idle', 'loading', 'no-results', 'unavailable'];

    function show(state) {
      for (var i = 0; i < STATES.length; i += 1) {
        var el = root.querySelector('[data-search-state="' + STATES[i] + '"]');
        if (el) el.hidden = STATES[i] !== state;
      }
    }

    function clearResults() {
      list.hidden = true;
      list.textContent = '';
    }

    function safeHref(value) {
      try {
        var url = new URL(String(value), window.location.origin);
        return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null;
      } catch (error) {
        return null;
      }
    }

    function renderResults(results) {
      clearResults();

      var fragment = document.createDocumentFragment();
      var count = 0;

      results.forEach(function (result) {
        if (!result || !result.title) return;
        var href = safeHref(result.href);
        if (!href) return;

        var item = template.content.firstElementChild.cloneNode(true);
        var link = item.querySelector('.search__result');
        var title = item.querySelector('.search__result-title');
        var excerpt = item.querySelector('.search__result-excerpt');
        var kind = item.querySelector('.search__result-kind');

        link.href = href;
        title.textContent = String(result.title);
        if (kind) {
          if (result.kind) kind.textContent = String(result.kind);
          else kind.hidden = true;
        }
        if (result.excerpt) {
          excerpt.textContent = String(result.excerpt);
        } else {
          excerpt.hidden = true;
        }

        fragment.appendChild(item);
        count += 1;
      });

      if (!count) {
        show('no-results');
        return;
      }

      list.appendChild(fragment);
      list.hidden = false;
      show(null);
    }

    var DEBOUNCE_MS = 200;
    var MIN_TERM = 2;
    var timer = null;
    var inFlight = null;
    var requestId = 0;

    function run(term) {
      var api = provider();
      if (!api) {
        clearResults();
        show('unavailable');
        return;
      }

      if (inFlight && inFlight.abort) inFlight.abort();
      var controller = typeof AbortController === 'function' ? new AbortController() : null;
      inFlight = controller;
      var id = ++requestId;

      clearResults();
      show('loading');

      Promise.resolve(api.query(term, { signal: controller ? controller.signal : undefined }))
        .then(function (results) {
          if (id !== requestId) return;
          renderResults(Array.isArray(results) ? results : []);
        })
        .catch(function () {
          if (id !== requestId) return;
          clearResults();
          show('unavailable');
        });
    }

    function schedule() {
      if (timer) clearTimeout(timer);
      var term = input.value.trim();

      if (term.length < MIN_TERM) {
        if (inFlight && inFlight.abort) inFlight.abort();
        inFlight = null;
        requestId += 1;
        clearResults();
        show('idle');
        return;
      }

      timer = setTimeout(function () {
        run(term);
      }, DEBOUNCE_MS);
    }

    function reset() {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      if (inFlight && inFlight.abort) inFlight.abort();
      inFlight = null;
      requestId += 1;
      form.reset();
      clearResults();
      show('idle');
    }

    function available() {
      if (typeof trigger.checkVisibility === 'function') return trigger.checkVisibility();
      return trigger.offsetParent !== null;
    }

    function open() {
      if (dialog.open || !available()) return;
      reset();
      if (document.activeElement === document.body && trigger.offsetParent !== null) {
        trigger.focus();
      }
      dialog.showModal();
      input.focus();
      input.select();
    }

    trigger.addEventListener('click', open);
    closeButton.addEventListener('click', function () {
      dialog.close();
    });

    input.addEventListener('input', schedule);

    input.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      event.preventDefault();
      dialog.close();
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (timer) clearTimeout(timer);
      var term = input.value.trim();
      if (term.length >= MIN_TERM) run(term);
    });

    var pressedBackdrop = false;
    dialog.addEventListener('pointerdown', function (event) {
      pressedBackdrop = event.target === dialog;
    });
    dialog.addEventListener('click', function (event) {
      if (pressedBackdrop && event.target === dialog) dialog.close();
      pressedBackdrop = false;
    });

    dialog.addEventListener('close', function () {
      reset();

      setTimeout(function () {
        if (document.activeElement !== document.body) return;
        if (trigger.offsetParent !== null) trigger.focus();
      }, 0);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key !== 'k' && event.key !== 'K') return;
      if (!(event.metaKey || event.ctrlKey)) return;
      if (event.altKey || event.shiftKey) return;
      if (!dialog.open && !available()) return;
      event.preventDefault();
      if (dialog.open) dialog.close();
      else open();
    });

    var desktop = window.matchMedia('(min-width: 1200px)');
    desktop.addEventListener('change', function () {
      if (!desktop.matches && dialog.open) dialog.close();
    });

    window.addEventListener('thrad:search-provider', function () {
      if (dialog.open) schedule();
    });
  })();
</script><script>
  (function () {
    var INDEX_URL = '/search-index.json';
    var LIMIT = 8;
    /* Title over description over body: a page called "Attribution" beats one that mentions
       attribution in passing, however often it mentions it. */
    var WEIGHT = { t: 12, d: 4, k: 2, b: 1 };

    var loading = null;
    var entries = null;

    function load(signal) {
      if (entries) return Promise.resolve(entries);
      if (!loading) {
        loading = fetch(INDEX_URL, { credentials: 'omit' })
          .then(function (response) {
            if (!response.ok) throw new Error('search index ' + response.status);
            return response.json();
          })
          .then(function (payload) {
            entries = (payload && payload.entries) || [];
            /* Lowercased once here rather than on every keystroke against every record. */
            for (var i = 0; i < entries.length; i += 1) {
              var e = entries[i];
              e._t = (e.t || '').toLowerCase();
              e._d = (e.d || '').toLowerCase();
              e._k = (e.k || '').toLowerCase();
              e._b = (e.b || '').toLowerCase();
            }
            return entries;
          })
          .catch(function (error) {
            loading = null;
            throw error;
          });
      }
      return loading;
    }

    function score(entry, words, phrase) {
      var total = 0;

      for (var f in WEIGHT) {
        var hay = entry['_' + f];
        if (!hay) continue;

        for (var i = 0; i < words.length; i += 1) {
          var at = hay.indexOf(words[i]);
          if (at === -1) continue;
          total += WEIGHT[f];
          /* A word starting the field, or starting a word within it, beats one buried
             inside another word — "ad" should rank "Ad server" over "broadcast". */
          if (at === 0) total += WEIGHT[f];
          else if (/[^a-z0-9]/.test(hay.charAt(at - 1))) total += WEIGHT[f] / 2;
        }

        if (phrase && hay.indexOf(phrase) !== -1) total += WEIGHT[f] * 2;
      }

      return total;
    }

    function matchesEvery(entry, words) {
      for (var i = 0; i < words.length; i += 1) {
        var w = words[i];
        if (entry._t.indexOf(w) === -1 && entry._d.indexOf(w) === -1 && entry._b.indexOf(w) === -1) {
          return false;
        }
      }
      return true;
    }

    window.thradSearch = {
      query: function (term, options) {
        var signal = options && options.signal;
        var phrase = String(term || '').toLowerCase().trim();
        var words = phrase.split(/\s+/).filter(Boolean);
        if (!words.length) return Promise.resolve([]);

        return load(signal).then(function (all) {
          if (signal && signal.aborted) return [];

          var hits = [];
          for (var i = 0; i < all.length; i += 1) {
            var entry = all[i];
            /* Every word has to appear somewhere, so "chatgpt ads" does not return
               everything mentioning ads. */
            if (!matchesEvery(entry, words)) continue;
            var s = score(entry, words, words.length > 1 ? phrase : '');
            if (s > 0) hits.push({ s: s, e: entry });
          }

          hits.sort(function (a, b) {
            return b.s - a.s || a.e.t.length - b.e.t.length;
          });

          return hits.slice(0, LIMIT).map(function (hit) {
            return { title: hit.e.t, href: hit.e.u, kind: hit.e.k, excerpt: hit.e.d };
          });
        });
      },
    };
  })();
