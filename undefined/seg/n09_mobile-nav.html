const toggleId = "site-nav-toggle";

  (function () {
    var panel = document.getElementById(panelId);
    var toggle = document.getElementById(toggleId);

    if (!panel || !toggle) return;

    panel.setAttribute('data-mnav-enhanced', '');
    panel.setAttribute('inert', '');
    var fallbacks = document.querySelectorAll('[data-nav-fallback]');
    for (var f = 0; f < fallbacks.length; f += 1) fallbacks[f].remove();

    var root = document.documentElement;
    var backdrop = panel.querySelector('[data-mnav-backdrop]');
    var desktop = window.matchMedia('(min-width: 1200px)');
    var FOCUSABLE = 'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])';

    function isOpen() {
      return panel.getAttribute('data-open') === 'true';
    }

    function ring() {
      var items = [toggle];
      var candidates = panel.querySelectorAll(FOCUSABLE);
      for (var i = 0; i < candidates.length; i += 1) {
        var el = candidates[i];
        if (el !== toggle && el.getClientRects().length) items.push(el);
      }
      return items;
    }

    function lockScroll() {
      root.style.setProperty('--mnav-scrollbar', window.innerWidth - root.clientWidth + 'px');
      root.setAttribute('data-mnav-lock', '');
    }

    function unlockScroll() {
      root.removeAttribute('data-mnav-lock');
      root.style.removeProperty('--mnav-scrollbar');
    }

    function open() {
      if (isOpen()) return;
      panel.removeAttribute('inert');
      panel.setAttribute('data-open', 'true');
      toggle.setAttribute('aria-expanded', 'true');
      lockScroll();

      var target = ring()[1];
      if (!target) return;
      target.focus();
      if (document.activeElement !== target) {
        requestAnimationFrame(function () {
          if (isOpen() && target.isConnected) target.focus();
        });
      }
    }

    function close(force) {
      if (!isOpen()) return;

      if (force || panel.contains(document.activeElement)) toggle.focus();

      panel.setAttribute('data-open', 'false');
      panel.setAttribute('inert', '');
      toggle.setAttribute('aria-expanded', 'false');
      unlockScroll();
    }

    toggle.addEventListener('click', function () {
      if (isOpen()) close(true);
      else open();
    });

    if (backdrop) {
      backdrop.addEventListener('click', function () {
        close();
      });
    }

    panel.addEventListener('click', function (event) {
      var target = event.target;
      if (target && target.closest && target.closest('a[href]')) close();
    });

    document.addEventListener('keydown', function (event) {
      if (!isOpen()) return;

      if (event.key === 'Escape') {
        event.preventDefault();
        close(true);
        return;
      }

      if (event.key !== 'Tab') return;

      var items = ring();
      if (!items.length) return;

      event.preventDefault();
      var index = items.indexOf(document.activeElement);
      var next;
      if (index === -1) next = event.shiftKey ? items.length - 1 : 0;
      else next = (index + (event.shiftKey ? -1 : 1) + items.length) % items.length;
      items[next].focus();
    });

    desktop.addEventListener('change', function (event) {
      if (!event.matches || !isOpen()) return;
      var hadFocus = panel.contains(document.activeElement);
      close();
      if (!hadFocus || document.activeElement === toggle) return;
      var brand = document.querySelector('.site-header__brand');
      if (brand) brand.focus();
    });
  })();
})();</script><div
